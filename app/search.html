<!DOCTYPE html>
<html lang="en" class="access-loading"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Search | AI Emailer</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="css/shared.css" rel="stylesheet"/>
<script>
  /* Apply saved theme before first paint to avoid a light/dark flash */
  (function () {
    var saved = localStorage.getItem("ai-emailer-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/shared-overrides.css">
<link rel="icon" type="image/svg+xml" href="icon/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16.png?v=2">
<link rel="shortcut icon" href="icon/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=2">
</head>
<body data-page="search">
<script>if (!localStorage.getItem("ai-emailer-token")) window.location.replace("login.html");</script>
<a class="skip-link" href="#content">Skip to content</a>
<main class="content" id="content" tabindex="-1"><div class="demo-note" id="demoNotice" hidden><strong>Sample data</strong><span id="demoNoticeText"></span></div><section class="page active" id="page-search">
<div class="page-head">
<div><h1>Smart Search</h1><p>Ask your inbox anything, in plain English.</p></div>
</div>
<div class="smart-search-box">
<i class="fa-solid fa-sparkles"></i>
<input id="smartSearchInput" placeholder='Try: "Show invoices from Amazon" or "Find all resignation emails"' type="text"/>
<button class="btn btn-primary" id="smartSearchBtn">Ask AI</button>
</div>
<div class="chip-row">
<button class="query-chip">Show invoices from Amazon</button>
<button class="query-chip">Find all resignation emails</button>
<button class="query-chip">Emails needing my reply today</button>
<button class="query-chip">High priority emails this week</button>
</div>
<div class="card table-card" id="searchResultsCard" style="display:none;">
<div class="card-head"><h3>Results</h3></div>
<table class="data-table">
<thead><tr><th>Sender</th><th>Subject</th><th>Category</th><th>Time</th></tr></thead>
<tbody id="searchResultsBody"></tbody>
</table>
</div>
</section></main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
