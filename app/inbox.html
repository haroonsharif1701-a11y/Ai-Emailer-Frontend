<!DOCTYPE html>
<html lang="en" class="access-loading"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inbox | AI Emailer</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="css/shared.css" rel="stylesheet"/>
<script>
  /* Apply saved theme before first paint to avoid a light/dark flash */
  (function () {
    var saved = localStorage.getItem("ai-emailer-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="css/inbox.css">
<link rel="stylesheet" href="css/shared-overrides.css">
<link rel="icon" type="image/svg+xml" href="icon/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16.png?v=2">
<link rel="shortcut icon" href="icon/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=2">
</head>
<body data-page="inbox">
<script>if (!localStorage.getItem("ai-emailer-token")) window.location.replace("login.html");</script>
<a class="skip-link" href="#content">Skip to content</a>
<main class="content" id="content" tabindex="-1"><div class="demo-note" id="demoNotice" hidden><strong>Sample data</strong><span id="demoNoticeText"></span></div><section class="page active" id="page-inbox">
<div class="page-head">
<div><h1>Inbox</h1><p>Review messages, summaries, and action items.</p></div>
<div class="tab-group">
<button class="btn btn-outline" id="mailConnect" type="button" hidden>Connect Gmail</button>
<button class="btn btn-outline" id="mailDisconnect" type="button" hidden>Disconnect</button>
<button class="btn btn-primary" id="mailSync" type="button" disabled>Refresh</button>
</div>
</div>
<p id="mailStatus" role="status" aria-live="polite"></p>
<div class="inbox-layout">
<div class="card inbox-list">
<div class="card-head">
<div class="tab-group" id="inboxTabs">
<button class="tab active" data-filter="all">All</button>
<button class="tab" data-filter="unread">Unread</button>
<button class="tab" data-filter="flagged">Starred</button>
</div>
</div>
<div id="inboxItems"></div>
<button class="btn btn-outline" id="mailMore" type="button" hidden>Load more</button>
</div>
<div class="card inbox-detail" id="inboxDetail">
<p class="empty-hint"><i aria-hidden="true" class="fa-regular fa-envelope-open"></i> Select a message to read its summary and action items</p>
</div>
</div>
</section></main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/shared.js"></script>
<script src="js/permissions.js"></script>
<script src="js/inbox.js"></script>
</body></html>
