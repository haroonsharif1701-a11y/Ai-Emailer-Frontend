<!DOCTYPE html>
<html lang="en" class="access-loading"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Attachments | AI Emailer</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="css/shared.css" rel="stylesheet"/>
<script>
  /* Apply saved theme before first paint to avoid a light/dark flash */
  (function () {
    var saved = localStorage.getItem("ai-emailer-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="css/attachments.css">
<link rel="stylesheet" href="css/shared-overrides.css">
<link rel="icon" type="image/svg+xml" href="icon/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16.png?v=2">
<link rel="shortcut icon" href="icon/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png?v=2">
</head>
<body data-page="attachments">
<script>if (!localStorage.getItem("ai-emailer-token")) window.location.replace("login.html");</script>
<a class="skip-link" href="#content">Skip to content</a>
<main class="content" id="content" tabindex="-1"><div class="demo-note" id="demoNotice" hidden><strong>Sample data</strong><span id="demoNoticeText"></span></div><section class="page active" id="page-attachments">
<div class="page-head">
<div><h1>Attachment Analyzer</h1><p>Extract summaries and key information from text-based documents.</p></div>
</div>
<div aria-describedby="attachmentHelp" aria-label="Choose a document to analyze" class="dropzone" id="attachDropzone" role="button" tabindex="0">
<i class="fa-solid fa-cloud-arrow-up"></i>
<p>Drag &amp; drop a file here, or <span>browse</span></p>
<span class="dz-sub" id="attachmentHelp">PDF, DOCX, XLSX · Up to 10 MB · Scanned images are not supported</span>
<input accept=".pdf,.docx,.xlsx" id="attachFileInput" style="display:none;" type="file"/>
</div>
<p aria-live="polite" class="field-status" id="attachmentStatus" role="status"></p>
<div class="attach-grid" id="attachGrid"></div>
</section></main><div aria-hidden="true" aria-labelledby="attachmentModalTitle" aria-modal="true" class="attachment-modal" id="attachmentModal" role="dialog">
<div class="attachment-modal__backdrop" data-close-attachment-modal=""></div>
<div class="attachment-modal__dialog" role="document">
<button aria-label="Close attachment details" class="attachment-modal__close" data-close-attachment-modal="" type="button">
<i class="fa-solid fa-xmark"></i>
</button>
<div id="attachmentModalContent"></div>
</div>
</div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/shared.js"></script>
<script src="js/permissions.js"></script>
<script src="js/attachments.js"></script>
</body></html>
